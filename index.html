function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  var html=await open(pw);
  if(remember){try{sessionStorage.setItem('fk-pw',pw)}catch(x){}}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;b.textContent='Verifica in corso...';e.textContent='';
  try{await go(document.getElementById('pw').value,true)}
  catch(x){e.textContent='Password non corretta.';b.disabled=false;b.textContent='Entra'}
});
(function(){var s;try{s=sessionStorage.getItem('fk-pw')}catch(x){} if(s)go(s,false).catch(function(){})})();
